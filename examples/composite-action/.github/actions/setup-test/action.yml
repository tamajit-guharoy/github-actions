# =============================================================================
# Composite Action: Setup, Lint, and Test
# =============================================================================
# A reusable composite action that sets up Node.js, installs dependencies,
# runs linting, and executes tests. Use this when the same steps appear in
# multiple workflows — instead of copy-pasting 40 lines, use 1 line.
#
# Demonstrates: composite action structure, inputs, outputs, shell: requirement,
#               calling other actions from within a composite, conditional steps.
# =============================================================================

name: 'Setup, Lint, and Test'
description: 'Install Node.js dependencies, run linter, and execute tests'

# ---------- INPUTS ----------
# Define what the caller can customize.
inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '20'
  working-directory:
    description: 'Directory containing package.json'
    required: false
    default: '.'
  lint:
    description: 'Whether to run the linter'
    required: false
    default: 'true'

# ---------- OUTPUTS ----------
# Values that the caller can reference via steps.<id>.outputs.*
outputs:
  test-result:
    description: 'Result of the test step (success, failure, skipped)'
    value: ${{ steps.test.outcome }}

# ---------- STEPS ----------
# runs: using: 'composite' tells GitHub this is a composite action (YAML steps),
# not a JavaScript or Docker action. Every run: step MUST specify a shell:.
runs:
  using: 'composite'
  steps:

    # Step 1: Install Node.js with npm caching
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    # Step 2: Install dependencies (clean install — respects lockfile)
    - name: Install dependencies
      run: npm ci
      shell: bash                                # shell: is REQUIRED in composite actions
      working-directory: ${{ inputs.working-directory }}

    # Step 3: Run the linter (only if inputs.lint is 'true')
    - name: Run linter
      if: inputs.lint == 'true'                  # Conditional — skip lint if not wanted
      run: npm run lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    # Step 4: Run tests — the id 'test' is used by the output above
    - id: test
      name: Run tests
      run: npm test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
