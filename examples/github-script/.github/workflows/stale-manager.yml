# =============================================================================
# Stale Issue Manager — GitHub Script Example
# =============================================================================
# Runs weekly to close issues labeled "stale" that have been inactive
# for 7+ days. Demonstrates: scheduled triggers, GraphQL API via github-script,
# listing issues with filters, bulk operations.
# =============================================================================

name: Stale Issue Manager

on:
  schedule:
    - cron: '37 8 * * 1'                          # Every Monday at 8:37 AM UTC (off-peak)
  workflow_dispatch:                               # Allow manual run for testing

permissions:
  issues: write

jobs:
  close-stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // ---------------------------------------------------------------
            // Find issues labeled "stale" that haven't been updated in 7 days
            // ---------------------------------------------------------------
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'stale',
              sort: 'updated',
              direction: 'asc',
              per_page: 50
            });

            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 7);

            let closedCount = 0;

            for (const issue of issues) {
              const updatedAt = new Date(issue.updated_at);

              if (updatedAt < cutoff) {
                // Post a closing comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Closing this issue — it has been marked stale with no activity for 7 days.\n\nFeel free to reopen if this is still relevant.`
                });

                // Close the issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });

                core.info(`Closed #${issue.number}: ${issue.title}`);
                closedCount++;
              }
            }

            // Write summary
            await core.summary
              .addHeading('Stale Issue Manager — ' + new Date().toISOString().slice(0, 10))
              .addRaw(`- Total stale issues found: ${issues.length}\n`)
              .addRaw(`- Issues closed (inactive > 7 days): ${closedCount}\n`)
              .addRaw(`- Issues remaining (activity within 7 days): ${issues.length - closedCount}\n`)
              .write();

            if (closedCount === 0) {
              core.info('No stale issues to close this week');
            }
