# =============================================================================
# Node.js CI Workflow
# =============================================================================
# Runs on every push and pull request to the 'main' branch.
# Demonstrates: checkout, setup-node, npm caching, matrix strategy,
#               sequential jobs (needs), and artifact uploads.
# =============================================================================

name: Node.js CI                              # Display name shown in the Actions tab

# ---------- TRIGGERS ----------
on:
  push:
    branches: [main]                           # Run on every push to main
  pull_request:
    branches: [main]                           # Run when a PR targets main

# ---------- JOBS ----------
jobs:

  # ===== LINT JOB =====
  # Runs first (no 'needs' = starts immediately).
  lint:
    runs-on: ubuntu-latest                     # GitHub-hosted Linux runner

    steps:
      # Step 1: Clone the repository onto the runner
      - uses: actions/checkout@v4

      # Step 2: Install Node.js 20 and configure npm caching
      #         The 'cache: npm' key automatically caches ~/.npm so
      #         'npm ci' is fast on subsequent runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 20                     # Pin a specific version
          cache: 'npm'                         # Auto-restore node_modules cache

      # Step 3: Install dependencies (clean install — respects lockfile)
      - run: npm ci

      # Step 4: Run the linter
      - run: npm run lint

  # ===== TEST JOB =====
  # Runs AFTER lint passes ('needs: lint'). If lint fails, this is skipped.
  test:
    needs: lint                                # Only run after lint succeeds
    runs-on: ubuntu-latest

    # Matrix strategy: run this same job for each Node version listed.
    # Each combination becomes a separate parallel job runner.
    strategy:
      matrix:
        node-version: [18, 20, 22]             # Test against 3 LTS versions

    steps:
      # Step 1: Clone the repository
      - uses: actions/checkout@v4

      # Step 2: Install the matrix-specific Node version
      #         ${{ matrix.node-version }} resolves to 18, 20, or 22
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'                         # Cached per Node version

      # Step 3: Install dependencies
      - run: npm ci

      # Step 4: Run tests (Jest with coverage)
      - run: npm test

      # Step 5: Upload coverage report as a workflow artifact
      #         Available on the Actions run summary page for 90 days.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}  # Unique per matrix leg
          path: coverage/                                  # Directory to upload
