# =============================================================================
# Monorepo CI — Cross-Language Build
# =============================================================================
# Runs tests for a monorepo containing a Node.js frontend and Python backend.
# Demonstrates: path filtering at trigger level, job-level defaults for
# working-directory, parallel jobs for different languages, cache-dependency-path
# for subdirectory lock files.
# =============================================================================

name: Monorepo CI                                # Display name in the Actions tab

# ---------- TRIGGERS ----------
on:
  push:
    branches: [main]                             # Run on every push to main
    paths:
      - 'examples/monorepo/**'                   # Only when monorepo files change
      - '.github/workflows/monorepo-ci.yml'      # Or when THIS workflow changes
  pull_request:
    branches: [main]
    paths:
      - 'examples/monorepo/**'
      - '.github/workflows/monorepo-ci.yml'
  workflow_dispatch:                             # Manual trigger from the Actions tab

# ---------- JOBS ----------
jobs:

  # ===== FRONTEND (NODE.JS) =====
  # Job-level defaults.run.working-directory means all run: commands execute
  # in ./examples/monorepo/frontend — no need to repeat it on every step.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/monorepo/frontend  # All run: steps use this directory
    steps:
      - uses: actions/checkout@v4                # Clone the entire monorepo

      - uses: actions/setup-node@v4              # Install Node.js
        with:
          node-version: 20                       # Pin the Node version
          cache: 'npm'                           # Auto-cache ~/.npm
          cache-dependency-path: examples/monorepo/frontend/package-lock.json  # Subdirectory lock file

      - run: npm ci                              # Clean install — runs in ./frontend

      - run: npm run lint                        # ESLint — runs in ./frontend

      - run: npm test                            # Jest — runs in ./frontend

  # ===== BACKEND (PYTHON) =====
  # Same pattern as frontend — defaults.run.working-directory keeps it clean.
  # Frontend and backend run in PARALLEL (no 'needs' between them).
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/monorepo/backend  # All run: steps use this directory
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5            # Install Python
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: examples/monorepo/backend/pyproject.toml

      - run: pip install .[dev]                  # Install package + dev deps

      - uses: astral-sh/ruff-action@v3           # Fast Python linter
        with:
          args: "check"
          src: "./examples/monorepo/backend"     # Target the backend source

      - run: pytest tests/ -v                    # Run tests — runs in ./backend
