# =============================================================================
# Python CI — Calculator Example
# =============================================================================
# Lints (Ruff) and tests (pytest) the Python example across 4 versions.
# Demonstrates: setup-python with pip caching, Ruff action for linting,
#               pytest with coverage and JUnit XML, if: always() for
#               artifact upload even on test failure.
# =============================================================================

name: Python CI                                  # Display name in the Actions tab

# ---------- TRIGGERS ----------
on:
  push:
    branches: [main]                             # Run on every push to main
    paths:
      - 'examples/python-app/**'                 # Only when the Python example changes
      - '.github/workflows/python-ci.yml'        # Or when THIS workflow changes
  pull_request:
    branches: [main]                             # Run when a PR targets main
    paths:
      - 'examples/python-app/**'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:                             # Manual trigger from the Actions tab

# ---------- JOBS ----------
jobs:

  # ===== LINT JOB =====
  # Runs Ruff — a single-binary Python linter (Rust-based, ~100x faster
  # than flake8). Uses the ruff-action so no pip install is needed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                # Clone the repo

      - uses: astral-sh/ruff-action@v3           # Official Ruff action (no pip needed)
        with:
          args: "check"                          # 'check' = lint only ('format --check' for style)
          src: "./examples/python-app"           # Target only the Python example

  # ===== TEST JOB =====
  # Runs AFTER lint passes. Tests across 4 Python versions in parallel
  # via matrix strategy. Coverage and JUnit XML are produced for each leg.
  test:
    needs: lint                                  # Only start after lint succeeds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-app   # All run: steps use this directory

    # Matrix strategy: each Python version runs in its own parallel job.
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]  # Supported CPython versions

    steps:
      - uses: actions/checkout@v4                # Clone the repo

      - uses: actions/setup-python@v5            # Install the matrix-specific version
        with:
          python-version: ${{ matrix.python-version }}  # Resolves to 3.10–3.13
          cache: 'pip'                           # Auto-cache ~/.cache/pip
          cache-dependency-path: examples/python-app/pyproject.toml

      - run: python -m pip install --upgrade pip # Upgrade pip to latest (ensures modern resolver)

      - run: pip install .[dev]                  # Install package + [project.optional-dependencies] dev group

      # Run pytest with coverage and JUnit XML output.
      # --cov=src          → measure coverage for the src/ package
      # --cov-report=term-missing → show uncovered lines in the log
      # --junitxml=        → machine-readable report (used by the artifact step)
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --junitxml=test-results.xml

      # Upload test results even when tests FAIL — if: always() ensures
      # the artifact is available for debugging flaky or broken tests.
      - uses: actions/upload-artifact@v4
        if: always()                             # Run regardless of test pass/fail
        with:
          name: test-results-py-${{ matrix.python-version }}  # e.g., test-results-py-3.12
          path: examples/python-app/test-results.xml
