# =============================================================================
# Reusable Workflow CI
# =============================================================================
# Lints and tests the reusable workflow example code directly.
# The reusable workflow pattern is demonstrated within the example itself
# (ci.yml calls _build.yml). This root CI validates the example's app code.
# =============================================================================

name: Reusable Workflow CI                       # Display name in the Actions tab

# ---------- TRIGGERS ----------
on:
  push:
    branches: [main]                             # Run on every push to main
    paths:
      - 'examples/reusable-workflow/**'          # Only when this example changes
      - '.github/workflows/reusable-workflow-ci.yml'  # Or when this workflow changes
  pull_request:
    branches: [main]
    paths:
      - 'examples/reusable-workflow/**'
      - '.github/workflows/reusable-workflow-ci.yml'
  workflow_dispatch:                             # Manual trigger from the Actions tab

# ---------- JOBS ----------
jobs:

  # Lint and test the example app code across Node 20 and 22.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reusable-workflow  # All steps run in the example dir
    steps:
      - uses: actions/checkout@v4                # Clone the repo

      - uses: actions/setup-node@v4              # Install Node.js
        with:
          node-version: 20                       # Pin the Node version
          cache: 'npm'                           # Auto-cache ~/.npm
          cache-dependency-path: examples/reusable-workflow/package-lock.json

      - run: npm ci                              # Clean install (respects lockfile)

      - run: npm run lint                        # ESLint

      - run: npm test                            # Jest
